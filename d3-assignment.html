<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-md bg-light border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvas" aria-controls="navbarOffcanvas" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvas" aria-labelledby="navbarOffcanvasLabel">
        
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="navbarOffcanvasLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      
      <div class="offcanvas-body">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="d3.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="d3-prices.html">Prices</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="d3-features.html">Features</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="d3-assignment.html">Register</a>
          </li>
        </ul>
      </div>
      
    </div>
  </div>
</nav>

<form class="regform" id="registerForm">
    <h1>Resgister!</h1>
    <label>Full Name</label>
    <input type="text" placeholder="John Doe" required>
    <br>
    <label>Age</label>
    <input type="number" placeholder="67" required>
    <br>
    <label>Email</label>
    <input type="email" placeholder="example@gmail.com" required>
    <br>
    <label>Password</label>
    <input type="password" id="pwd" placeholder="Minimum length 6" required minlength="6">
    <br>
    <label>Confirm Passoword</label>
    <input type="password" id="confirmPwd" placeholder="Minimum length 6" required minlength="6">
    <br>
    <button>Submit</button>
</form>

<div class="text-center">
        <button class="btn btn-danger btn-lg shadow" type="button" data-bs-toggle="collapse" data-bs-target="#hiddenRickroll" aria-expanded="false">
            DO NOT CLICK THIS BUTTON
        </button>


        <div class="collapse mt-4" id="hiddenRickroll">
            <div class="card card-body text-center mx-auto shadow" style="max-width: 500px;">
                <h4 class="mb-3">Gotcha! 🕺</h4>
                
                <div class="ratio ratio-16x9">
                    <iframe 
                        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" 
                        title="Rickroll" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('registerForm');
    const pwd = document.getElementById('pwd');
    const confirmPwd = document.getElementById('confirmPwd');

    form.addEventListener('submit', function(event) {
        
        if (pwd.value !== confirmPwd.value) {
            
            event.preventDefault(); 
            alert("Passwords do not match. Please try again.");
        }
    });
</script>
</body>
</html>
